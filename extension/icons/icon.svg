<!-- SponsorJobs' app icon: the sidebar brand mark (a page + a needle), standalone.

     This is the app's IDENTITY, not decoration. In an --app window Chrome puts the
     favicon in the title bar, the taskbar and alt-tab, so with no icon it fell back to
     its generic globe and the window announced itself as "a website". Cursor shows its
     own mark there; ours showed Chrome's.

     Ink is baked rather than currentColor: an icon is rendered by the OS shell, outside
     the page, where our CSS variables and `currentColor` do not exist. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="none">
  <rect width="20" height="20" rx="4.5" fill="#131316"/>
  <rect x="3" y="2" width="11" height="16" rx="2" fill="#e7e7ea" opacity="0.18"/>
  <path d="M6 6.2h6M6 9.4h6M6 12.6h3.5" stroke="#e7e7ea" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M13.5 12.5l3.4 3.4M15.2 10.8l2.9 2.9a1 1 0 0 1-1.4 1.4l-2.9-2.9z" stroke="#e7e7ea" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
