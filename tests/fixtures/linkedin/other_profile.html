<!doctype html>
<html lang="en">
<head><title>Someone Else | LinkedIn</title></head>
<body>
<main>
  <section class="artdeco-card pv-top-card">
    <div class="pv-top-card__photo-wrapper">
      <img class="pv-top-card-profile-picture__image--show" src="https://media.licdn.com/dms/image/x/0/1?e=1" alt="Someone Else" />
    </div>
    <div class="ph5 pb5">
      <h1 class="text-heading-xlarge">Someone Else</h1>
      <div class="text-body-medium break-words">Head of Data at Initech</div>
      <span class="text-body-small inline t-black--light break-words">Austin, Texas, United States</span>
      <div class="pvs-profile-actions">
        <button class="artdeco-button"><span aria-hidden="true">Connect</span></button>
        <button class="artdeco-button"><span aria-hidden="true">Message</span></button>
      </div>
    </div>
  </section>
  <section class="artdeco-card pv-profile-card" data-view-name="profile-card">
    <div id="about" class="pv-profile-card__anchor"></div>
    <h2><span aria-hidden="true">About</span></h2>
    <div class="inline-show-more-text"><span aria-hidden="true">I lead data at Initech.</span></div>
  </section>
</main>
</body>
</html>
