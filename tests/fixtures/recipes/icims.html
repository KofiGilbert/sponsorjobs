<!-- Trimmed from https://fdcnmcareers-ulta.icims.com/jobs/login?in_iframe=1 (fetched 2026-10-11):
     the first step of an iCIMS apply, inside the portal's content iframe. The form id, field
     ids, labels and the Next button are verbatim. -->
<div id="iCIMS_Header"></div>
<form id="enterEmailForm" method="post" action="/jobs/login">
  <div class="iCIMS_FieldRow">
    <label for="email">Email</label>
    <input id="email" name="email" type="text" />
  </div>
  <div class="iCIMS_FieldRow">
    <label for="countryCode">Phone Country Code</label>
    <input id="countryCode" name="countryCode" type="text" />
    <label for="phoneNumber">Number</label>
    <input id="phoneNumber" name="phoneNumber" type="text" />
  </div>
  <input id="enterEmailSubmitButton" type="submit" class="iCIMS_PrimaryButton " value="Next" />
</form>
