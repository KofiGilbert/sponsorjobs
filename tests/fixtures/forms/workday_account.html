<!doctype html>
<html><head><meta charset="utf-8"><title>Apply (Workday create-account fixture)</title>
<link rel="stylesheet" href="style.css">
<style>.trap { position: absolute; left: 20px; top: 600px; width: 200px; }</style></head>
<body>
<!-- Markup patterns seen on *.myworkdayjobs.com/.../apply/applyManually (October 2026): the
     "Create Account" wall (email, password, verify password, terms checkbox) and an anti-spam
     trap input that says in its label it is for robots. With ?open=1 the password boxes are gone,
     to check the trap is still never filled on an ordinary page. Field labels only. -->
<h2>Create Account</h2>
<form onsubmit="return false">
  <div class="field"><label for="email">Email Address*</label><input type="text" id="email" data-automation-id="email"></div>
  <div class="field" id="pw1"><label for="password">Password*</label><input type="password" id="password" data-automation-id="password"></div>
  <div class="field" id="pw2"><label for="verifyPassword">Verify New Password*</label><input type="password" id="verifyPassword" data-automation-id="verifyPassword"></div>
  <div class="field"><input type="checkbox" id="terms" data-automation-id="createAccountCheckbox"><label for="terms">Yes, I have read and consent to the terms and conditions</label></div>
  <div class="trap"><label for="website">Enter website. This input is for robots only, do not enter if you're human.</label>
    <input type="text" id="website" name="website" data-automation-id="beecatcher"></div>
  <button type="button" data-automation-id="createAccountSubmitButton">Create Account</button>
</form>
<script>
  if (new URLSearchParams(location.search).get("open")) { document.getElementById("pw1").remove(); document.getElementById("pw2").remove(); }
  window.fxValues = () => ({ email: document.getElementById("email").value, website: document.getElementById("website").value });
</script>
</body></html>
