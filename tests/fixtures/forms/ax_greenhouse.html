<!doctype html>
<html><head><meta charset="utf-8"><title>Apply (Greenhouse form check fixture)</title>
<link rel="stylesheet" href="style.css">
<style>.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.select__single-value { padding: 2px 0; } .file-upload__filename { display: inline-block; margin-right: 8px; }</style>
</head>
<body>
<!-- Markup patterns seen on job-boards.greenhouse.io (November 2026, the Gusto run): labels with a
     trailing "*", react-select dropdowns whose chosen value is a sibling div (the input itself stays
     empty) with a hidden required mirror input, an upload group per file whose chosen file shows as
     a filename div with a Remove button, and a "How did you hear" checkbox group. ?state=bug is the
     page the agent left on 2026-11-16 (every box ticked, the resume in the Cover Letter box, a
     dropdown left open, an invalid URL, Last Name empty); ?state=clean is the same form done right.
     No personal values: the file names and the text are placeholders. -->
<h1>Business Intelligence Analyst</h1>
<form id="application-form" onsubmit="return false">
  <div class="field"><label for="first_name">First Name*</label><input type="text" id="first_name" aria-required="true"></div>
  <div class="field"><label for="last_name">Last Name*</label><input type="text" id="last_name" aria-required="true"></div>
  <div class="field"><label for="email">Email*</label><input type="text" id="email" aria-required="true"></div>
  <div class="field"><label for="linkedin">LinkedIn Profile</label><input type="text" id="linkedin" aria-describedby="linkedin-error">
    <div id="linkedin-error" class="helper-text helper-text--error" hidden>Enter a valid URL.</div></div>

  <div class="field" id="auth-field">
    <label id="auth-label" for="auth">Are you legally authorized to work in the United States?*</label>
    <div class="select__container"><div class="select__control"><div class="select__value-container" id="auth-vc">
      <div class="select__single-value">Yes</div>
      <div class="select__input-container"><input id="auth" role="combobox" aria-expanded="false" aria-autocomplete="list"
        aria-labelledby="auth-label" aria-required="true" class="select__input" autocomplete="off" type="text" style="width:40px"></div>
    </div><div class="select__indicators">v</div></div>
    <input required tabindex="-1" aria-hidden="true" class="css-1a0ro4n-requiredInput" style="opacity:0;pointer-events:none;position:absolute;height:12px;width:100%" value="Yes"></div>
  </div>

  <div class="field" id="spons-field">
    <label id="spons-label" for="spons">Will you now or in the future require sponsorship?*</label>
    <div class="select__container"><div class="select__control"><div class="select__value-container">
      <div class="select__single-value">No</div>
      <div class="select__input-container"><input id="spons" role="combobox" aria-expanded="false" aria-autocomplete="list"
        aria-labelledby="spons-label" aria-required="true" class="select__input" autocomplete="off" type="text" style="width:40px"></div>
    </div><div class="select__indicators">v</div></div>
    <div class="select__menu" id="spons-menu" hidden><div class="select__menu-list" role="listbox" id="react-select-spons-listbox">
      <div class="select__option" role="option" aria-selected="false" id="react-select-spons-option-0">Yes</div>
      <div class="select__option" role="option" aria-selected="true" id="react-select-spons-option-1">No</div>
    </div></div></div>
  </div>

  <div class="field"><div role="group" aria-labelledby="upload-label-resume" class="file-upload">
    <div id="upload-label-resume" class="label upload-label">Resume/CV<span class="required">*</span></div>
    <div id="resume-chosen"></div>
    <div><button type="button" class="btn">Attach</button><label class="visually-hidden" for="resume">Attach</label>
      <input id="resume" class="visually-hidden" type="file" accept=".pdf,.doc,.docx"></div>
  </div></div>
  <div class="field"><div role="group" aria-labelledby="upload-label-cover_letter" class="file-upload">
    <div id="upload-label-cover_letter" class="label upload-label">Cover Letter</div>
    <div id="letter-chosen"></div>
    <div><button type="button" class="btn">Attach</button><label class="visually-hidden" for="cover_letter">Attach</label>
      <input id="cover_letter" class="visually-hidden" type="file" accept=".pdf,.doc,.docx"></div>
  </div></div>

  <fieldset class="checkbox" id="hear"><legend>How did you hear about this job?*</legend>
    <div><input type="checkbox" id="hear_0" name="question_9[]" value="0"><label for="hear_0">LinkedIn</label></div>
    <div><input type="checkbox" id="hear_1" name="question_9[]" value="1"><label for="hear_1">Indeed</label></div>
    <div><input type="checkbox" id="hear_2" name="question_9[]" value="2"><label for="hear_2">Glassdoor</label></div>
    <div><input type="checkbox" id="hear_3" name="question_9[]" value="3"><label for="hear_3">Company website</label></div>
    <div><input type="checkbox" id="hear_4" name="question_9[]" value="4"><label for="hear_4">Referral</label></div>
  </fieldset>
  <fieldset class="checkbox" id="tools"><legend>Which tools have you used? (select all that apply)</legend>
    <div><input type="checkbox" id="tool_0" name="question_10[]" value="0"><label for="tool_0">SQL</label></div>
    <div><input type="checkbox" id="tool_1" name="question_10[]" value="1"><label for="tool_1">Tableau</label></div>
    <div><input type="checkbox" id="tool_2" name="question_10[]" value="2"><label for="tool_2">Looker</label></div>
  </fieldset>
  <button type="submit" id="submit">Submit application</button>
</form>
<script>
  const st = new URLSearchParams(location.search).get("state") || "bug";
  const chip = (host, name) => {
    const d = document.createElement("div");
    d.className = "file-upload__filename-wrap";
    d.innerHTML = '<span class="file-upload__filename"></span><button type="button" aria-label="Remove file">x</button>';
    d.querySelector(".file-upload__filename").textContent = name;
    document.getElementById(host).appendChild(d);
  };
  document.getElementById("first_name").value = "Test";
  document.getElementById("email").value = "applicant@example.com";
  chip("resume-chosen", "resume.pdf");
  document.getElementById("hear_0").checked = true;
  document.getElementById("tool_0").checked = true;
  document.getElementById("tool_1").checked = true;
  if (st === "bug") {
    for (let i = 1; i < 5; i++) document.getElementById("hear_" + i).checked = true;
    chip("letter-chosen", "resume.pdf");
    document.getElementById("spons").setAttribute("aria-expanded", "true");
    document.getElementById("spons").setAttribute("aria-controls", "react-select-spons-listbox");
    document.getElementById("spons-menu").hidden = false;
    const li = document.getElementById("linkedin");
    li.value = "not a url";
    li.setAttribute("aria-invalid", "true");
    document.getElementById("linkedin-error").hidden = false;
  } else {
    document.getElementById("last_name").value = "Applicant";
  }
</script>
</body></html>
