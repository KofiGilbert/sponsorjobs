<!doctype html>
<html><head><meta charset="utf-8"><title>Job Application for Data Analyst at Example Co</title>
<link rel="stylesheet" href="style.css"><script src="widgets.js"></script>
<style>.spacer { height: 900px; } .bar { display: flex; justify-content: flex-end; }</style></head>
<body>
<!-- Greenhouse's job board form (the new "job-boards" layout) as it showed on 2026-11-27, with
     the question shapes the owner met on InStride and Stripe: react-select lists whose search box
     hides at opacity 0 once a choice is made, and a "Clear selections" button then appears.
     Made-up company; no real site. -->
<h1>Data Analyst</h1>
<form id="application-form" onsubmit="window.__submits = (window.__submits || 0) + 1; return false">
  <div class="field"><label for="first_name">First Name *</label><input type="text" id="first_name" name="first_name" value="Avery" required></div>
  <div class="field"><label for="email">Email *</label><input type="email" id="email" name="email" value="avery.example@example.com" required></div>
  <div class="spacer"></div>
  <div id="widgets"></div>
  <div class="spacer"></div>
  <div class="bar"><button type="submit" id="submit">Submit application</button></div>
</form>
<script>
  const W = window.FixtureWidgets, host = document.getElementById("widgets");
  window.fx = {
    friends: W.ReactSelect(host, { id: "question_101", live: true, gh: true, required: true,
      label: "Do you have any friends, relatives, or acquaintances working for Example Co? *", options: ["Yes", "No"] }),
    remote: W.ReactSelect(host, { id: "question_102", live: true, gh: true, required: true,
      label: "If this role offers the option to work from a remote location, do you plan to work remotely? *",
      options: ["Yes, I intend to work remotely.", "No, I intend to work from an office location."] }),
    privacy: W.ReactSelect(host, { id: "question_103", live: true, gh: true, required: true,
      label: "By submitting my application, I agree to Example Co's Job Applicant Privacy Policy *", options: ["Yes"] }),
  };
  window.fxValues = () => Object.fromEntries(Object.entries(window.fx).map(([k, v]) => [k, v.value]));
</script>
</body></html>
