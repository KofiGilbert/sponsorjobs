name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The weekly board-discovery PR is opened with GITHUB_TOKEN, which starts no pull_request
  # workflows; grow-boards.yml dispatches this on its branch so the PR still gets its pytest check.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60     # the suite takes 25 to 30 min on the runner; at 30 it timed out 3 times in 2 days (shown as cancelled)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The resume templates need these LaTeX packages; tests that compile a real PDF (the
      # one-page and no-overfull checks) need them. poppler-utils gives pdftocairo, which (with
      # Pillow and numpy from the dev extras) lets the full-page test measure how far down the
      # page every template preview reaches. Installed fresh each run: caching the packages
      # (tried 2026-10-10) restored the files but not the pdflatex program, and 66 resume tests
      # quietly skipped.
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra cm-super \
            poppler-utils

      # Fail loudly, never skip quietly: without these the resume tests skip and the run still
      # looks green.
      - name: Check the PDF tools are really there
        run: pdflatex --version | head -1 && pdftocairo -v 2>&1 | head -1

      - name: Install SponsorJobs
        run: pip install -e ".[dev,llm]"

      # Four at a time (pytest-xdist): about 11 minutes became about 2. --dist loadfile keeps each
      # test file on one worker, because several files write a fixed-name helper script.
      # The suite writes several GB of temp files (rendered resumes, feed shards, SQLite copies);
      # since 2026-10-20 that overran the runner's temp space ("Disk quota exceeded"). Give pytest
      # the runner's large scratch disk and drop toolchains this job never uses.
      - name: Make room for the test temp files
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          sudo mkdir -p /mnt/pytest && sudo chown "$USER" /mnt/pytest
          df -h / /mnt | tail -2

      - name: Run tests
        run: python -m pytest -q -n auto --dist loadfile --basetemp=/mnt/pytest/run
