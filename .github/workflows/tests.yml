name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The résumé templates need these LaTeX packages; tests that compile a real PDF
      # (the one-page and no-overfull checks) are skipped without them.
      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra cm-super \
            poppler-utils
      # poppler-utils gives pdftocairo, which (with Pillow and numpy from the dev extras) lets the
      # full-page test measure how far down the page every template preview reaches. Without it
      # that test skips, and a half-empty template would go unnoticed.

      - name: Install SponsorJobs
        run: pip install -e ".[dev,llm]"

      - name: Run tests
        run: python -m pytest -q
