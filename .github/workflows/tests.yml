name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The resume templates need these LaTeX packages; tests that compile a real PDF (the
      # one-page and no-overfull checks) are skipped without them. poppler-utils gives pdftocairo,
      # which (with Pillow and numpy from the dev extras) lets the full-page test measure how far
      # down the page every template preview reaches. Cached between runs: installing them from
      # scratch took about 2 of every 13 minutes. Pinned to a commit, not a moving tag.
      - name: Install LaTeX (cached)
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9   # v1.6.3
        with:
          packages: texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra cm-super poppler-utils
          version: 1
          # LaTeX builds its format files in post-install scripts; a restored cache must rerun
          # them or pdflatex has no format to load.
          execute_install_scripts: true

      - name: Install SponsorJobs
        run: pip install -e ".[dev,llm]"

      # Four at a time (pytest-xdist): about 11 minutes became about 3. --dist loadfile keeps each
      # test file on one worker, because several files write a fixed-name helper script.
      - name: Run tests
        run: python -m pytest -q -n auto --dist loadfile
