name: feed

# Builds the STATIC job feed (scripts/build_feed.py) every 3 hours and publishes it to one of two
# hosts, chosen by the FEED_HOST repository variable (see docs/feed.md, "Where the feed is hosted"):
#   pages (default)  GitHub Pages from this public repo: free, no card, no secrets.
#   r2               Cloudflare R2 via scripts/upload_feed.py (needs the R2_* secrets).
# Either way the app reads the same address (TAILOR_FEED_URL), so switching hosts is a settings
# change here, never an app release. Replaces the always-on Render "kitchen".
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write       # the Pages deploy job publishes the built feed
  id-token: write    # ...and proves it is this repo's workflow doing it

# One build at a time: a slow crawl must never overlap the next tick's run.
concurrency:
  group: static-feed
  cancel-in-progress: false

jobs:
  build-and-upload:
    # Skip (no runner, no minutes, no failure email) until the host is set up and the
    # TAILOR_FEED_URL repository variable exists. See docs/feed.md.
    if: ${{ vars.TAILOR_FEED_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      FEED_DATA_DIR: ${{ github.workspace }}/.feed-data
      # Built under .site/feed so the Pages artifact (.site) serves it at <domain>/feed/...,
      # the same paths R2 serves with R2_PREFIX=feed.
      FEED_OUT_DIR: ${{ github.workspace }}/.site/feed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # The crawl's state (jobs DB + sponsor overlay) persists between runs, so first_seen, the
      # cross-run dedup and the 21-day prune work as they did on the server. A per-run key with a
      # prefix restore means every run starts from the previous run's DB and saves a new copy.
      - name: Restore crawl state
        uses: actions/cache@v4
        with:
          path: .feed-data
          key: feed-data-${{ github.run_id }}
          restore-keys: |
            feed-data-

      - name: Install
        run: pip install -e . boto3

      - name: Build the feed
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # Repository VARIABLES (Settings > Secrets and variables > Actions > Variables):
          FEED_INCLUDE_AGGREGATORS: ${{ vars.FEED_INCLUDE_AGGREGATORS }}
          JOBS_MAX_PER_COMPANY: ${{ vars.JOBS_MAX_PER_COMPANY || 500 }}
          TAILOR_FEED_URL: ${{ vars.TAILOR_FEED_URL }}
          FEED_CRAWL_MINUTES: ${{ vars.FEED_CRAWL_MINUTES || 70 }}
        run: |
          python scripts/build_feed.py --data "$FEED_DATA_DIR" --out "$FEED_OUT_DIR" \
            --jobs-url "${TAILOR_FEED_URL:-https://tailor.example/feed}/jobs.json.gz"

      - name: Upload to R2
        if: ${{ vars.FEED_HOST == 'r2' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
        run: python scripts/upload_feed.py --dir "$FEED_OUT_DIR"

      - name: Package for GitHub Pages
        if: ${{ vars.FEED_HOST != 'r2' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy-pages:
    needs: build-and-upload
    if: ${{ vars.TAILOR_FEED_URL != '' && vars.FEED_HOST != 'r2' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
