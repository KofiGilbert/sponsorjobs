name: feed

# Builds the STATIC job feed (scripts/build_feed.py) every 3 hours and publishes it to one of two
# hosts, chosen by the FEED_HOST repository variable (see docs/feed.md, "Where the feed is hosted"):
#   pages (default)  GitHub Pages from this public repo: free, no card, no secrets.
#   r2               Cloudflare R2 via scripts/upload_feed.py (needs the R2_* secrets).
# Either way the app reads the same address (TAILOR_FEED_URL), so switching hosts is a settings
# change here, never an app release. Replaces the always-on Render "kitchen".
#
# The board crawl is split in four (two on 2026-10-13, three on 2026-10-18, four on 2026-10-23:
# the 2026-10-23 run's shards took 128 / 112 / 121 minutes of the 140-minute cap, so a quarter of
# the boards each leaves room for the giant Workday boards' split listing): a matrix of crawl
# SHARDS runs side by side, each crawling its own quarter of the board list (scripts/build_feed.py board_shard) into a copy of the saved crawl state, and
# uploads only what it changed. One MERGE job then folds every shard's changes into the saved
# state, writes the feed once and publishes it once. More boards per run at no cost (public repo:
# Actions minutes are free). Shard 0 also runs the career-site lane and the aggregator APIs, so
# nothing is fetched twice. FEED_SHARD_COUNT must equal the number of matrix entries.
#
# The crawl state (2026-10-30) lives in a PRIVATE R2 bucket, R2_STATE_BUCKET (scripts/feed_state.py):
# each shard downloads the SLIM state (no stored descriptions, ~1/10 of the size), the merge job the
# FULL state, and the merge saves the next state after a good build. R2 has no egress fees and no
# account egress limit, unlike the Actions cache this replaced. docs/feed.md, "The crawl state".
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      crawl_minutes:
        description: "Crawl time cap in minutes (blank = the usual 70)"
        required: false
      state_id:
        description: "Start from this saved R2 state id instead of the latest (rollback; docs/feed.md)"
        required: false
      seed_from_cache:
        description: "BOOTSTRAP: copy this Actions cache key (e.g. feed-data-41039418699) to R2 first"
        required: false
      allow_empty_state:
        description: "BOOTSTRAP: start from an empty database when R2 holds no saved state"
        type: boolean
        default: false
      allow_drop:
        description: "Publish even when the feed shrank under 80% of the last one"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write       # the Pages deploy job publishes the built feed
  id-token: write    # ...and proves it is this repo's workflow doing it

# One build at a time: a slow crawl must never overlap the next tick's run. The group covers the
# whole run (both crawl shards and the merge), so the next tick waits for the merge to finish.
concurrency:
  group: static-feed
  cancel-in-progress: false

env:
  # The crawl state lives in a PRIVATE R2 bucket (scripts/feed_state.py, docs/feed.md "The crawl
  # state"), never in the public feed bucket, whose custom domain serves every key.
  R2_STATE_BUCKET: ${{ vars.R2_STATE_BUCKET }}
  R2_STATE_PREFIX: ${{ vars.R2_STATE_PREFIX || 'state' }}

jobs:
  # BOOTSTRAP only (workflow_dispatch with seed_from_cache): copy a saved Actions-cache state into
  # R2 once, so the first R2 run starts from it. One cache download (~380 MB), then never again.
  seed-state:
    if: ${{ inputs.seed_from_cache && vars.TAILOR_FEED_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore the named cache state
        uses: actions/cache/restore@v4
        with:
          path: .feed-data
          key: ${{ inputs.seed_from_cache }}
          fail-on-cache-miss: true
      - name: Install
        run: pip install -e . boto3
      - name: Save it to R2 as the latest state
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: python scripts/feed_state.py push --data .feed-data --id "seed-${{ inputs.seed_from_cache }}"

  crawl:
    needs: seed-state
    # Skip (no runner, no minutes, no failure email) until the host is set up and the
    # TAILOR_FEED_URL repository variable exists. See docs/feed.md. Runs whether or not the
    # bootstrap seed job ran, but not after it failed.
    if: ${{ !cancelled() && vars.TAILOR_FEED_URL != '' && needs.seed-state.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 175
    strategy:
      # One shard failing must not cancel the other: the merge publishes what succeeded.
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      FEED_DATA_DIR: ${{ github.workspace }}/.feed-data
      FEED_SHARD_INDEX: ${{ matrix.shard }}
      FEED_SHARD_COUNT: 4
    steps:
      - uses: actions/checkout@v4

      # No `cache: pip`: the wheels come from PyPI. The Actions cache is not used at all (its
      # account egress limit cut a run off from its state on 2026-10-30; docs/feed.md).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e . boto3

      # The SLIM saved state (scripts/feed_state.py export_shard_state): the jobs DB without the
      # stored descriptions, plus the cursors; ~1/10 of the full state. The shards only READ it:
      # the merge job is the one writer. A missing state stops the run: starting from an empty
      # database publishes a fraction of the board and saves that as the next base.
      - name: Restore the shard state from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python scripts/feed_state.py pull --kind slim --dest "$FEED_DATA_DIR" \
            --id "${{ inputs.state_id }}" \
            --id-file "${{ github.workspace }}/.shard/base-${{ matrix.shard }}.txt" \
            ${{ inputs.allow_empty_state && '--allow-empty' || '' }}

      - name: Crawl this shard
        env:
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
          # Repository VARIABLES (Settings > Secrets and variables > Actions > Variables):
          FEED_INCLUDE_AGGREGATORS: ${{ vars.FEED_INCLUDE_AGGREGATORS }}
          # Rows kept per board per run. 2000 cut every giant employer (CVS Health lists 19,541) to
          # 2,000; rows already stored with a checked description cost nothing to keep.
          JOBS_MAX_PER_COMPANY: ${{ vars.JOBS_MAX_PER_COMPANY || 25000 }}
          FEED_CRAWL_MINUTES: ${{ inputs.crawl_minutes || vars.FEED_CRAWL_MINUTES || 140 }}
          # Descriptions read per giant Workday / SmartRecruiters board PER RUN. The code default
          # (2000) let 18 boards eat a whole 20-minute run; 200 lets a run reach many boards, and
          # descriptions already stored are never re-read, so big boards still fill in over runs.
          WORKDAY_MAX_DETAIL_FEED: ${{ vars.WORKDAY_MAX_DETAIL_FEED || 600 }}
          # Rows LISTED per Workday board. One query stops at Workday's 2,000-row ceiling; past it
          # the board is split by its own facets (job family, full/part time...) into queries of
          # under 2,000 each (sourcing/workday.py split_plan), for at most WORKDAY_SPLIT_SECONDS
          # per board per run, rotating between runs. The list is US-only where the board offers a
          # country facet, so these are US rows.
          WORKDAY_MAX_JOBS: ${{ vars.WORKDAY_MAX_JOBS || 25000 }}
          WORKDAY_SPLIT_SECONDS: ${{ vars.WORKDAY_SPLIT_SECONDS || 600 }}
          SMARTRECRUITERS_MAX_DETAIL_FEED: ${{ vars.SMARTRECRUITERS_MAX_DETAIL_FEED || 200 }}
          # The career-site lane (sourcing/careersite.py) runs beside shard 0's board pass: its own
          # wall-clock cap, job pages read per site per run, and hosts crawled at once (each host
          # still sees one request at a time). CAREERSITE_LANE=0 switches it off.
          CAREERSITE_LANE: ${{ vars.CAREERSITE_LANE || 1 }}
          CAREERSITE_MINUTES: ${{ vars.CAREERSITE_MINUTES || 130 }}
          CAREERSITE_MAX_DETAIL: ${{ vars.CAREERSITE_MAX_DETAIL || 1000 }}
          CAREERSITE_WORKERS: ${{ vars.CAREERSITE_WORKERS || 4 }}
          # Job pages read across ALL career sites per run (the site order rotates between runs
          # from a cursor in the data dir, so the end of the table is reached too).
          CAREERSITE_PAGE_BUDGET: ${{ vars.CAREERSITE_PAGE_BUDGET || 12000 }}
          # Amazon's own search JSON (sourcing/amazonjobs.py) is a board, so it lands in one shard:
          # newest N per run; stored rows are still capped by JOBS_MAX_PER_COMPANY.
          AMAZON_MAX_JOBS: ${{ vars.AMAZON_MAX_JOBS || 5000 }}
          # freehire search-by-sponsor pass (sourcing/freehire_sponsors.py, shard 0 only): requests
          # per run against freehire's keyless API, company look-ups included. 0 switches it off.
          FREEHIRE_SPONSOR_PASS_REQUESTS: ${{ vars.FREEHIRE_SPONSOR_PASS_REQUESTS || 200 }}
        run: |
          python scripts/build_feed.py --data "$FEED_DATA_DIR" \
            --export-delta "${{ github.workspace }}/.shard/shard-${{ matrix.shard }}.db"

      - name: Hand the shard's changes to the merge
        uses: actions/upload-artifact@v4
        with:
          name: feed-shard-${{ matrix.shard }}
          # The delta, and which saved state it was crawled from (the merge restores that one).
          path: |
            .shard/shard-${{ matrix.shard }}.db
            .shard/base-${{ matrix.shard }}.txt
          retention-days: 1
          if-no-files-found: error

  build-and-upload:
    # Runs when at least one shard finished (always() + the check below), so a failed shard
    # still publishes the others' fresh boards; the failed shard's boards keep the rows the saved
    # state already holds and its cursor stays put, so the next run retries them. If NO shard
    # produced output, build_feed.py --merge-dir fails and nothing is published or saved.
    needs: crawl
    if: ${{ always() && !cancelled() && vars.TAILOR_FEED_URL != '' && needs.crawl.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60   # the merge + build of ~120k jobs takes ~25 min; 30 cut 7 of 8 runs (Oct 17-18)
    env:
      FEED_DATA_DIR: ${{ github.workspace }}/.feed-data
      # Built under .site/feed so the Pages artifact (.site) serves it at <domain>/feed/...,
      # the same paths R2 serves with R2_PREFIX=feed.
      FEED_OUT_DIR: ${{ github.workspace }}/.site/feed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e . boto3

      - name: Collect the shards' changes
        uses: actions/download-artifact@v4
        with:
          pattern: feed-shard-*
          path: .shards

      # The FULL saved state, the same one the shards started from (their base-*.txt name it; the
      # concurrency group keeps any other run out). A missing state stops the run, unless this is
      # a deliberate first-ever run (allow_empty_state).
      - name: Restore the crawl state from R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python scripts/feed_state.py pull --kind full --dest "$FEED_DATA_DIR" \
            --id "${{ inputs.state_id }}" --pair-dir .shards \
            --save-manifest "${{ github.workspace }}/.state/restored.json" \
            ${{ inputs.allow_empty_state && '--allow-empty' || '' }}

      - name: Merge the shards and build the feed
        env:
          TAILOR_FEED_URL: ${{ vars.TAILOR_FEED_URL }}
          JOBS_FEED_LIMIT: ${{ vars.JOBS_FEED_LIMIT || 1000000 }}
          # Pruning (docs/feed.md, "When a row leaves"): a row unseen JOBS_FAST_PRUNE_DAYS days on a
          # board that was read in full since goes; every row goes at JOBS_PRUNE_DAYS days unseen.
          JOBS_FAST_PRUNE_DAYS: ${{ vars.JOBS_FAST_PRUNE_DAYS || 7 }}
          JOBS_PRUNE_DAYS: ${{ vars.JOBS_PRUNE_DAYS || 21 }}
        run: |
          python scripts/build_feed.py --data "$FEED_DATA_DIR" --out "$FEED_OUT_DIR" \
            --merge-dir .shards \
            --jobs-url "${TAILOR_FEED_URL:-https://tailor.example/feed}/jobs.json.gz"

      # The publish guard: a feed under 80% of the one live now is a broken run (2026-10-30: an
      # empty restored state published 158,535 jobs instead of ~233,000). Nothing is published or
      # saved; the live feed and the saved state stay as they are. allow_drop overrides it.
      - name: Check the feed did not shrink
        run: |
          python scripts/feed_state.py guard --manifest "$FEED_OUT_DIR/manifest.json" \
            --previous-url "${{ vars.TAILOR_FEED_URL }}/manifest.json" \
            --state-manifest "${{ github.workspace }}/.state/restored.json" \
            ${{ inputs.allow_drop && '--allow-drop' || '' }}

      # The merged state is saved ONLY after a successful merge and guard, as a new state named by
      # this run (full + slim archives, then the latest.json pointer last); the newest 5 are kept.
      - name: Save the crawl state to R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          python scripts/feed_state.py push --data "$FEED_DATA_DIR" --id "${{ github.run_id }}" \
            --feed-manifest "$FEED_OUT_DIR/manifest.json"

      # The browser extension's own sponsor lookup (works with no app installed): a sharded
      # index of the bundled H-1B / PERM / E-Verify data, written to <feed>/sponsors/. Built
      # every run (about 15 seconds) because a Pages deploy replaces the whole site; its
      # version is a content hash, so extensions only re-download when the data changed.
      - name: Build the extension's sponsor index
        run: python scripts/build_sponsor_index.py --out "$FEED_OUT_DIR"

      - name: Upload to R2
        if: ${{ vars.FEED_HOST == 'r2' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PREFIX: ${{ vars.R2_PREFIX }}
        run: python scripts/upload_feed.py --dir "$FEED_OUT_DIR"

      - name: Package for GitHub Pages
        if: ${{ vars.FEED_HOST != 'r2' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: .site

  deploy-pages:
    needs: build-and-upload
    # Explicit: a failed crawl shard upstream must not stop the deploy of a merge that succeeded.
    if: ${{ !cancelled() && needs.build-and-upload.result == 'success' && vars.TAILOR_FEED_URL != '' && vars.FEED_HOST != 'r2' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
