name: release

# Builds the desktop installers and attaches them to the GitHub release for a tag.
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# or run it by hand from the Actions tab with an existing tag. Each OS job builds the
# Python engine with PyInstaller (packaging/tailor.spec), then wraps it with
# electron-builder (shell-electron/package.json "build"). Neither build is signed with a
# paid certificate: Windows ships unsigned (SmartScreen warns once), macOS is ad-hoc signed
# by shell-electron/scripts/adhoc-sign.js so Gatekeeper shows "Open Anyway" instead of
# "damaged". See packaging/README.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # No Developer ID certificate yet; stop electron-builder looking for one in the keychain.
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  PYTHONUTF8: "1"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows-x64
            eb_args: --win
            asset_glob: shell-electron/release/*.exe
          # macos-latest runs on Apple Silicon, which is the only Mac target we ship
          # (electron-builder "mac.target.arch" is arm64). PyInstaller builds for the
          # machine it runs on, so this produces an arm64 engine.
          - os: macos-latest
            label: macos-arm64
            eb_args: --mac --arm64
            asset_glob: shell-electron/release/*.dmg
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: shell-electron/package-lock.json

      - name: Install SponsorJobs and PyInstaller
        shell: bash
        run: python -m pip install -e ".[llm]" pyinstaller

      # Stages packaging/seed/sponsors.db (public US government sponsor data). Without it
      # the installer ships with no visa data and every job reads "No sponsor record".
      - name: Stage the sponsor database
        shell: bash
        run: python packaging/bundle_sponsor_db.py

      - name: Build the engine (PyInstaller)
        shell: bash
        run: |
          pyinstaller packaging/tailor.spec --noconfirm
          test -d dist/SponsorJobs
          test -f packaging/seed/sponsors.db

      # The installer carries its own LaTeX, so nobody installs MacTeX or MiKTeX: a pinned
      # TinyTeX (TeX Live's own pdflatex, only the packages the templates use; see
      # packaging/README.md). It goes in dist/SponsorJobs/tinytex, next to the engine
      # executable, which is where tailoring/compiler.py looks first in an installed app.
      # Cached per OS until the pin, the package list or the installer script changes, so a
      # release does not depend on a TeX Live mirror being up.
      - name: Cache the bundled LaTeX
        id: tinytex-cache
        uses: actions/cache@v4
        with:
          path: .tinytex/tinytex
          key: tinytex-${{ matrix.label }}-${{ hashFiles('packaging/install_tinytex.py', 'packaging/texlive-packages.txt') }}

      - name: Install the bundled LaTeX (TinyTeX)
        if: steps.tinytex-cache.outputs.cache-hit != 'true'
        shell: bash
        run: python packaging/install_tinytex.py .tinytex/tinytex --cache .tinytex/download

      # Copied AFTER PyInstaller, which empties dist/SponsorJobs on every build. electron-builder
      # then ships the whole folder as resources/engine (shell-electron/package.json).
      - name: Put the LaTeX inside the engine
        shell: bash
        run: |
          rm -rf dist/SponsorJobs/tinytex
          cp -R .tinytex/tinytex dist/SponsorJobs/tinytex
          head -2 dist/SponsorJobs/tinytex/tinytex-manifest.txt
          du -sh dist/SponsorJobs/tinytex

      # Every template must compile to one page with the bundle, found the way the installed
      # engine finds it (no PATH, no PDFLATEX). A release never ships a LaTeX that fails.
      - name: Check every resume template with the bundled LaTeX
        shell: bash
        run: python packaging/latex_check.py --as-installed dist/SponsorJobs --out .tinytex/check

      # The installer file names carry package.json's version (SponsorJobs-Setup-<v>.exe,
      # SponsorJobs-<v>-arm64.dmg). Make that the tag's version so the asset matches the release.
      - name: Set the shell version from the tag
        shell: bash
        working-directory: shell-electron
        run: npm version "${TAG#v}" --no-git-tag-version --allow-same-version

      - name: Install the shell
        working-directory: shell-electron
        run: npm ci

      - name: Build the installer (electron-builder)
        working-directory: shell-electron
        shell: bash
        run: npx electron-builder ${{ matrix.eb_args }} --publish never

      - name: List the output
        shell: bash
        run: ls -la shell-electron/release

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.label }}
          path: ${{ matrix.asset_glob }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Attach to the release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: List the assets
        run: ls -la assets

      # The release notes are written for the people who install the app, not generated from
      # pull-request titles: docs/release-notes/<tag>.md when there is one, else a plain line.
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: docs/release-notes
      - name: Pick the release notes
        run: |
          f="src/docs/release-notes/${TAG}.md"
          if [ -f "$f" ]; then cp "$f" notes.md; else
            printf 'SponsorJobs %s for macOS (Apple Silicon) and Windows. Install steps: https://sponsorjobs.ai/download\n' "$TAG" > notes.md
          fi
          cat notes.md

      # Creates the release for the tag if it does not exist yet, else adds the assets to it.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: SponsorJobs ${{ env.TAG }}
          body_path: notes.md
          files: |
            assets/*.exe
            assets/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: false
          draft: false
          # A tag with a suffix (v0.1.0-rc2) is a test build, never the download students get.
          prerelease: ${{ contains(env.TAG, '-') }}
