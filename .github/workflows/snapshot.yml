name: feed snapshot

# Builds the job-list snapshot that ships inside the installer (packaging/seed/feed/) on a
# GitHub runner and publishes it as a workflow artifact. Use it when the maintainer's own
# connection is too slow to crawl, or to refresh the bundled list before a release:
#   gh workflow run snapshot.yml && gh run download --name feed-snapshot --dir packaging/seed/feed
# When TAILOR_FEED_URL (repository variable) points at the published feed, this is a 5 MB
# download instead of a crawl.
on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: "Crawl time cap in minutes (ignored when the feed URL is set)"
        default: "40"

permissions:
  contents: read

concurrency:
  group: feed-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install the engine
        run: pip install -e .
      - name: Build the snapshot
        env:
          TAILOR_FEED_URL: ${{ vars.TAILOR_FEED_URL }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }}
        run: python scripts/bundle_feed_snapshot.py --max-minutes "${{ github.event.inputs.max_minutes || '40' }}"
      - uses: actions/upload-artifact@v4
        with:
          name: feed-snapshot
          path: packaging/seed/feed/
          retention-days: 14
          if-no-files-found: error
